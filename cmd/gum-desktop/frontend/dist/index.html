<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gum Workflows</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar" data-wails-drag>
        <span class="wordmark">GUM</span>
        <span class="phase">Product tracer · macOS</span>
      </header>
      <section class="hero">
        <p class="eyebrow">LOCAL WORKFLOW STUDIO</p>
        <h1 id="title">Gum Workflows</h1>
        <p id="message" class="message">
          Open the local product workspace to verify the application seam.
        </p>
        <button id="open-workspace" type="button">Open workspace</button>
        <p id="status" class="status" aria-live="polite">Waiting for an action</p>
        <form id="create-workflow" class="workflow-form">
          <label for="workflow-name">Workflow display name</label>
          <div><input id="workflow-name" name="displayName" required /><button type="submit">Create</button></div>
        </form>
        <section class="workflow-library" aria-labelledby="workflow-library-title">
          <h2 id="workflow-library-title">Product Workflows</h2>
          <ol id="workflow-list"></ol>
        </section>
      </section>
      <aside class="boundary" aria-label="Product boundary">
        <p>UI</p><span>WorkflowClient</span><p>Application</p>
      </aside>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
