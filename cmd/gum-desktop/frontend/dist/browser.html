<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gum Workflows · Browser Mock</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <span class="wordmark">GUM</span>
        <span class="phase">Browser Mock</span>
      </header>
      <section class="hero">
        <p class="eyebrow">LOCAL WORKFLOW STUDIO</p>
        <h1 id="title">Gum Workflows</h1>
        <p id="message" class="message"></p>
        <button id="open-workspace" type="button">Open workspace</button>
        <p id="status" class="status" aria-live="polite"></p>
        <form id="create-workflow" class="workflow-form">
          <label for="workflow-name">Workflow display name</label>
          <div><input id="workflow-name" name="displayName" required /><button type="submit">Create</button></div>
        </form>
        <section class="workflow-library" aria-labelledby="workflow-library-title">
          <h2 id="workflow-library-title">Product Workflows</h2>
          <ol id="workflow-list"></ol>
        </section>
		<section class="draft-editor" aria-labelledby="draft-editor-title">
			<h2 id="draft-editor-title">Workflow Draft</h2>
			<p id="draft-status">Select a Product Workflow to edit its semantic Draft.</p>
			<textarea id="draft-content" aria-label="Workflow Draft semantic content" spellcheck="false" disabled></textarea>
			<ul id="draft-diagnostics" aria-label="Draft diagnostics"></ul>
		</section>
      </section>
      <aside class="boundary" aria-label="Product boundary">
        <p>UI</p><span>WorkflowClient</span><p>Fake Application</p>
      </aside>
    </main>
    <script type="module" src="./browser.js"></script>
  </body>
</html>
