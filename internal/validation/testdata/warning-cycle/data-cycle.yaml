apiVersion: workflow/v1
kind: workflow

metadata:
  name: invalid-data-cycle

projects:
  - name: order-system
    repository: ../examples/order-system

nodes:
  input:
    node: human-input

  backend:
    node: coding-agent

    inputs:
      openapi:
        from: frontend.openapi

  frontend:
    node: coding-agent

    inputs:
      openapi:
        from: backend.openapi
