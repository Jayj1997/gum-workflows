apiVersion: workflow/v1
kind: workflow

metadata:
  name: warning-control-cycle

projects:
  - name: order-system
    repository: ../examples/order-system

# 无 human 节点的 control 环：警告可能死循环（收敛保护兜底），不是错误。
nodes:
  build:
    node: cd
    dependsOn:
      - deploy

  deploy:
    node: cd
    dependsOn:
      - build
