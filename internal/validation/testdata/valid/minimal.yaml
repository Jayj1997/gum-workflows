apiVersion: workflow/v1
kind: workflow

metadata:
  name: minimal-development
  version: "1.0"

projects:
  - name: order-system
    repository: ../examples/order-system

nodes:

  input:
    node: human-input

  coder:
    node: coding-agent
    dependsOn: [input]

  sdk:
    node: openapi-generator

    inputs:
      openapi:
        from: coder.openapi
