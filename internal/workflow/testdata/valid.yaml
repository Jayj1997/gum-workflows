apiVersion: workflow/v1
kind: workflow

metadata:
  name: fullstack-development
  version: "1.0"

projects:
  - name: order-system
    repository: ./examples/order-system

nodes:

  input:
    node: human-input

  analysis:
    node: requirement-analysis
    inputs:
      requirement:
        from: input.requirement

  coder:
    node: coding-agent

    inputs:
      analysis-output:
        from: analysis.analysis-output

    config:
      task: 实现 order-system：产出源码与 OpenAPI 文档

  sdk:
    node: openapi-generator

    inputs:
      openapi:
        from: coder.openapi
