apiVersion: nodeDefinition/v1
kind: nodeDefinition
metadata:
  name: go-coverage-check
  description: 使用用户本机 Go 工具链运行全量测试并计算 statement coverage。
type: automation
requires: [project]
inputs:
  code:
    type: SourceCode
    description: 指向原地 Project Workspace 的代码引用。
outputs:
  result:
    type: QualityCheckResult
    description: 严格的测试覆盖率质量检查结果。
