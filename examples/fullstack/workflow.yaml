apiVersion: workflow/v1
kind: Workflow

metadata:
  name: fullstack-development
  version: "1.0"

project:
  repository: ./project
  branch: main

nodes:

  requirement:
    type: requirement-analysis

  architecture:
    type: architecture-design

    inputs:
      analysis-output:
        from: requirement.analysis-output

  backend:
    type: coding-agent

    config:
      task: 实现 order-system 后端：依据需求与架构产出源码与 OpenAPI 文档

    inputs:
      analysis-output:
        from: requirement.analysis-output
      architecture:
        from: architecture.architecture

  openapi:
    type: openapi-generator

    inputs:
      openapi:
        from: backend.openapi

  frontend:
    type: coding-agent

    config:
      task: 实现 order-system 前端：消费 OpenAPI 与生成的 Frontend SDK

    inputs:
      analysis-output:
        from: requirement.analysis-output
      openapi:
        from: backend.openapi
      frontend-sdk:
        from: openapi.frontend-sdk
