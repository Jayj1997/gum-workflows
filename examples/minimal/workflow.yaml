apiVersion: workflow/v1
kind: workflow

metadata:
  name: minimal-development
  version: "1.0"
  description: 最小人工入口示例：需求输入后依次分析、编码并生成 SDK。

projects:
  - name: order-system
    repository: ./project

nodes:

  input:
    node: human-input

  analysis:
    node: requirement-analysis
    inputs:
      requirement:
        from: input.requirement

  coder:
    node: coding-agent

    inputs:
      analysis-output:
        from: analysis.analysis-output

    metadata:
      name: 编码
      description: 依据任务在项目 Workspace 内产出源码与 OpenAPI 文档

    config:
      task: 实现 order-system：产出源码与 OpenAPI 文档

  sdk:
    node: openapi-generator

    inputs:
      openapi:
        from: coder.openapi
